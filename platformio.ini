[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200

; --- CORREGIDO para Waveshare ESP32-S3-Touch-AMOLED-2.06 ---
; Tu placa tiene 32MB de flash real, no el default de la devkitc-1 genérica
board_upload.flash_size = 32MB
board_build.f_flash = 80000000L
board_build.flash_mode = qio

; PSRAM en modo OPI (tu placa trae 8MB PSRAM tipo OPI, no QSPI genérica)
board_build.arduino.memory_type = qio_opi

; Partición más grande porque LVGL + gráficos ocupan más espacio que un sketch simple
board_build.partitions = default_16MB.csv

build_flags = 
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps = 
    bblanchon/ArduinoJson @ ^6.21.3
    lewisxhe/XPowersLib @ ^0.2.6
    
    https://github.com/tzapu/WiFiManager.git
    ; --- AGREGAR estas, usadas por los ejemplos que ya confirmamos funcionando ---
    lewisxhe/SensorLib @ ^0.2.0
    ; lvgl y Arduino_DriveBus probablemente NO estén en el registro público de PlatformIO
    ; tal como las usa Waveshare (versiones específicas) -> ver nota abajo